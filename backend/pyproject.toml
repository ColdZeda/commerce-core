[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]
"scripts/*.py" = ["E402"]
"stocklab/bench.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["."]
norecursedirs = [".venv", "migrations", "staticfiles", "node_modules", "build", "dist", ".*"]
addopts = "-q --strict-markers"
markers = ["concurrency: 需要真实 MySQL 的并发用例"]
# Django 6.0 会把 URLField 表单默认 scheme 改成 https；升级时再处理，先不刷屏。
filterwarnings = [
    "ignore:The default scheme will be changed from 'http' to 'https' in Django 6.0:DeprecationWarning",
]
