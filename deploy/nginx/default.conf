server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # C1：/admin/ 不暴露公网。本机或内网才放行，其余按 404 处理（不泄露"这里有个后台"）。
    location /admin/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 = @not_found;
        proxy_pass http://api:8000;
        # 不传 Host 会被 Django 的 ALLOWED_HOSTS 判成 400；$proxy_host 是 "api"
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # C3：比 uWSGI 的 harakiri(30s) 多留 5 秒，避免 nginx 先断
        proxy_read_timeout 35s;
    }

    # Vite 产物文件名带内容 hash，可以长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存：否则改了前端，用户还拿着旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # history fallback：/orders 这类前端路由刷新时由 index.html 接管
    location / {
        try_files $uri /index.html;
    }

    location @not_found {
        return 404;
    }
}
