server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # C1：/admin/ 不暴露公网。本机或内网才放行，其余按 404 处理（不泄露"这里有个后台"）。
    location /admin/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        error_page 403 = @not_found;
        proxy_pass http://api:8000;
        # 不传 Host 会被 Django 的 ALLOWED_HOSTS 判成 400；$proxy_host 是 "api"。
        # 用 $http_host 而不是 $host：$host 会丢掉端口，隧道开在 8081 时 Origin 带端口、
        # Host 不带，Django 的 CSRF 校验就判失败（登录直接 403）。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台静态（Django admin 的 CSS/JS）由 api 容器里的 whitenoise 发，nginx 只做转发。
    # 只转发 /static/，后台页面本身仍受上面 /admin/ 的 IP 限制约束。
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        # 文件名带内容 hash 的由 whitenoise 加长缓存，这里不额外覆盖。
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # C3：比 uWSGI 的 harakiri(30s) 多留 5 秒，避免 nginx 先断
        proxy_read_timeout 35s;
    }

    # Vite 产物文件名带内容 hash，可以长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不能缓存：否则改了前端，用户还拿着旧的资源清单
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # history fallback：/orders 这类前端路由刷新时由 index.html 接管
    location / {
        try_files $uri /index.html;
    }

    location @not_found {
        return 404;
    }
}
