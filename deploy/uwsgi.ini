[uwsgi]
chdir = /app
module = config.wsgi:application

master = true
processes = 2
threads = 2
thunder-lock = true

http-socket = 0.0.0.0:8000
buffer-size = 32768

# C3 超时链：innodb_lock_wait_timeout(10) < harakiri(30) < nginx uwsgi_read_timeout(35)
harakiri = 30
max-requests = 1000

die-on-term = true
log-4xx = true
log-5xx = true
