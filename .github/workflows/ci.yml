name: CI

# push / PR 跑 lint + test；main 上两个都绿了才构建并推镜像到 ACR。
# 部署（ssh → migrate → up -d）在 S7b 接，见 docs/phases/phase7.md。
on:
  push:
  pull_request:

env:
  # 仓库地址不是凭据；用户名/密码走 GitHub Secrets
  ACR_REGISTRY: crpi-3tubdvd6wrolewii.cn-shenzhen.personal.cr.aliyuncs.com

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: 注释规范
        run: python scripts/check_comments.py backend

      - name: 依赖锁定与 pip freeze 一致
        working-directory: backend
        run: python scripts/check_lock.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: commerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # 测试要建 test_commerce，容器里的普通账号没有该权限，CI 用 root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: commerce
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-pw
      MYSQL_TEST_DATABASE: test_commerce
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_DRIVER: pymysql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: pytest -q

  # 镜像只在 CI 构建（服务器 1.6 GiB 会 OOM）。tag 用 commit sha 前 7 位，与服务器 .current_tag 对齐。
  images:
    name: build & push
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 取 sha tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: api
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ACR_REGISTRY }}/commerce-core/api:${{ steps.tag.outputs.sha }}
          # ACR 不认 buildx 默认附带的 OCI attestation 清单（unknown manifest class for
          # application/vnd.oci.empty.v1+json），关掉才推得上去
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ACR_REGISTRY }}/commerce-core/web:${{ steps.tag.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 摘要
        run: |
          echo "sha: ${{ steps.tag.outputs.sha }}"
          echo "api: ${{ steps.api.outputs.digest }}"
          echo "web: ${{ steps.web.outputs.digest }}"
