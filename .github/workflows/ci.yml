name: CI

# push / PR 跑 lint + test；main 上两个都绿了才构建并推镜像到 ACR，随后自动部署。
# 手动触发时 mode=check 只做只读检查（不推镜像、不写服务器），mode=deploy 才真正部署。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 只验证连通性与预检；deploy = 真正部署"
        type: choice
        options: [check, deploy]
        default: check

env:
  # 仓库地址不是凭据；用户名/密码走 GitHub Secrets
  ACR_REGISTRY: crpi-3tubdvd6wrolewii.cn-shenzhen.personal.cr.aliyuncs.com

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: 注释规范
        run: python scripts/check_comments.py backend

      - name: 依赖锁定与 pip freeze 一致
        working-directory: backend
        run: python scripts/check_lock.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0.43
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: commerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # 测试要建 test_commerce，容器里的普通账号没有该权限，CI 用 root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: commerce
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-pw
      MYSQL_TEST_DATABASE: test_commerce
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_DRIVER: pymysql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pytest
        working-directory: backend
        run: pytest -q

  # 镜像只在 CI 构建（服务器 1.6 GiB 会 OOM）。tag 用 commit sha 前 7 位，与服务器 .current_tag 对齐。
  images:
    name: build & push
    runs-on: ubuntu-24.04
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 取 sha tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: api
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.mode != 'check' }}
          tags: ${{ env.ACR_REGISTRY }}/commerce-core/api:${{ steps.tag.outputs.sha }}
          # ACR 不认 buildx 默认附带的 OCI attestation 清单（unknown manifest class for
          # application/vnd.oci.empty.v1+json），关掉才推得上去
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.mode != 'check' }}
          tags: ${{ env.ACR_REGISTRY }}/commerce-core/web:${{ steps.tag.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 摘要
        run: |
          echo "sha: ${{ steps.tag.outputs.sha }}"
          echo "api: ${{ steps.api.outputs.digest }}"
          echo "web: ${{ steps.web.outputs.digest }}"

  # 服务器侧动作全部走 ssh，不引第三方 Action。顺序：连通性 → 上传 → 预检 → 部署。
  # main 上的 push 与手动 dispatch 都会部署（手动触发时 mode=check 可只看不动）。
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    needs: [images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: 取 sha tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 校验 compose（runner 本地）
        # 语法问题在 runner 上就挡住，不必等服务器预检；check 模式下服务器上可能还没有新文件
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod.example config -q

      - name: 准备 SSH 密钥
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH 连通性检查（只读）
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'echo SSH_OK; hostname; free -m | head -n2'

      - name: 上传 compose 与部署脚本
        if: env.MODE != 'check'
        run: |
          for f in deploy/docker-compose.prod.yml:/opt/commerce-core/.docker-compose.prod.new.yml \
                   deploy/deploy.sh:/opt/commerce-core/deploy.sh; do
            src=${f%%:*}; dst=${f##*:}
            uploaded=0
            for i in 1 2 3; do
              if scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new "$src" "$DEPLOY_USER@$DEPLOY_HOST:$dst"; then
                uploaded=1; break
              fi
              echo "scp $src 第 $i 次失败，重试"; sleep 5
            done
            # 重试耗尽必须让步骤失败：循环最后一句是 sleep，否则整步会以 0 退出（假绿）
            if [ "$uploaded" -ne 1 ]; then echo "scp $src 重试 3 次仍失败"; exit 1; fi
          done

      - name: 预检（只读）
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" '
              cd /opt/commerce-core || exit 1
              if [ -f .docker-compose.prod.new.yml ]; then
                docker compose -f .docker-compose.prod.new.yml config -q || exit 1
                echo COMPOSE_OK
              else
                echo "COMPOSE_SKIP：服务器上还没有新 compose（check 模式不写服务器）"
              fi
              echo "--- current tag ---"; grep -E "^IMAGE_TAG=" .env || true
              echo "--- containers ---"; docker compose -f docker-compose.yml ps --format "{{.Name}} {{.Status}}" || true
              echo "--- health（仅诊断）---"; curl -fsS -m 5 http://127.0.0.1:8080/api/v1/health || echo HEALTH_FAIL
              echo "--- memory（仅诊断）---"; free -m | head -n2
            '

      - name: 部署
        # push 触发时 inputs.mode 是空的，所以不能写成 == 'deploy'，否则整步被跳过、job 还是绿的
        if: env.MODE != 'check'
        run: |
          # 服务器上的 ACR 凭据会过期，部署前用 CI 的凭据刷新；密码走 stdin，不进命令行与日志
          printf '%s' "$ACR_PASSWORD" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login --username '$ACR_USERNAME' --password-stdin $ACR_REGISTRY"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/commerce-core && chmod +x deploy.sh && ./deploy.sh ${{ steps.tag.outputs.sha }}"

      - name: 收尾检查（只读）
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" '
              cd /opt/commerce-core || exit 0
              echo "--- tag files ---"; cat .current_tag .previous_tag 2>/dev/null || true
              echo "--- containers ---"; docker compose -f docker-compose.yml ps --format "{{.Name}} {{.Status}}" || true
              echo "--- health ---"; curl -fsS -m 5 http://127.0.0.1:8080/api/v1/health || echo HEALTH_FAIL
              echo "--- memory ---"; free -m | head -n2
            ' || true
